<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 아이패드 '홈 화면에 추가'로 실행하면 주소창 없이 전체화면 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="우리집 게임방">
  <meta name="theme-color" content="#fde68a">
  <title>우리집 게임방</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #4a3426;
      --sky-top: #bae6fd;
      --sky-bottom: #fef3c7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overscroll-behavior: none; }
    body {
      font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--sky-top) 0%, #fdf2f8 55%, var(--sky-bottom) 100%);
      -webkit-user-select: none; user-select: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      overflow-x: hidden;
    }
    .clouds { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .clouds span { position: absolute; font-size: 64px; opacity: .85; animation: drift linear infinite; }
    .clouds span:nth-child(1) { top: 6%; animation-duration: 60s; animation-delay: -10s; }
    .clouds span:nth-child(2) { top: 18%; font-size: 44px; animation-duration: 80s; animation-delay: -40s; }
    .clouds span:nth-child(3) { top: 9%; font-size: 52px; animation-duration: 70s; animation-delay: -60s; }
    @keyframes drift { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }

    h1 {
      position: relative; z-index: 1;
      margin: 0 0 4px; font-weight: normal; text-align: center;
      font-size: clamp(34px, 6.5vmin, 60px); color: #db2777;
      text-shadow: 0 4px 0 #fff, 0 6px 12px rgba(219, 39, 119, .2);
    }
    .sub { position: relative; z-index: 1; margin: 0 0 clamp(16px, 4vmin, 36px); font-size: clamp(17px, 2.6vmin, 22px); color: #7c5a45; text-align: center; }

    .games {
      position: relative; z-index: 1;
      display: grid; gap: clamp(14px, 3vmin, 28px);
      grid-template-columns: repeat(6, minmax(0, 1fr));
      width: min(1100px, 100%);
    }
    /* 5개 카드: 윗줄 3개, 아랫줄 2개 */
    .games > .card { grid-column: span 2; }
    .games > .card:nth-child(n+4) { grid-column: span 3; flex-direction: row; gap: 22px; }
    .games > .card:nth-child(n+4) > div:nth-child(2) { text-align: left; }
    @media (orientation: portrait), (max-width: 700px) {
      .games { grid-template-columns: 1fr; width: min(560px, 100%); }
      .games > .card, .games > .card:nth-child(n+4) { grid-column: auto; }
      .card { flex-direction: row !important; text-align: left !important; min-height: 0 !important; padding: 18px 22px !important; }
      .card .icon { font-size: 70px !important; margin: 0 !important; }
      .card .play { display: none !important; }
    }

    .card {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      text-align: center; text-decoration: none; color: #fff;
      border-radius: 36px; border: 6px solid rgba(255, 255, 255, .85);
      padding: 16px 16px 16px; min-height: clamp(170px, 30vmin, 280px);
      box-shadow: 0 10px 0 rgba(0, 0, 0, .12), 0 18px 30px rgba(0, 0, 0, .12);
      transition: transform .12s ease, box-shadow .12s ease;
      position: relative; overflow: hidden;
    }
    .card:active { transform: translateY(6px) scale(.98); box-shadow: 0 4px 0 rgba(0, 0, 0, .12), 0 8px 14px rgba(0, 0, 0, .12); }
    .card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 25% 15%, rgba(255,255,255,.35), transparent 45%); pointer-events: none; }
    .card .icon { font-size: clamp(60px, 10vmin, 110px); line-height: 1; filter: drop-shadow(0 6px 6px rgba(0,0,0,.18)); animation: bob 3s ease-in-out infinite; }
    .card:nth-child(2) .icon { animation-delay: -1s; }
    .card:nth-child(3) .icon { animation-delay: -2s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .card .name { font-size: clamp(28px, 4.6vmin, 42px); text-shadow: 0 3px 0 rgba(0,0,0,.15); }
    .card .desc { font-size: clamp(16px, 2.3vmin, 20px); opacity: .95; line-height: 1.35; }
    .card .play {
      margin-top: 4px; background: #fff; border-radius: 999px; padding: 8px 26px;
      font-size: clamp(20px, 3vmin, 26px); box-shadow: 0 4px 0 rgba(0,0,0,.12);
    }

    .gaon  { background: linear-gradient(160deg, #f472b6, #c026d3); }
    .gaon .play { color: #be185d; }
    .ocean { background: linear-gradient(160deg, #38bdf8, #1d4ed8); }
    .ocean .play { color: #1d4ed8; }
    .hangul { background: linear-gradient(160deg, #fbbf24, #f97316); }
    .hangul .play { color: #c2410c; }
    .bugs { background: linear-gradient(160deg, #84cc16, #15803d); }
    .bugs .play { color: #15803d; }
    .cars { background: linear-gradient(160deg, #60a5fa, #6366f1); }
    .cars .play { color: #4338ca; }
    .card .play { white-space: nowrap; flex: none; padding: 6px 22px; font-size: clamp(18px, 2.6vmin, 24px); }
    .card .name { font-size: clamp(24px, 4vmin, 38px); }

    .foot { position: relative; z-index: 1; margin-top: clamp(14px, 3vmin, 28px); font-size: 15px; color: #a08670; text-align: center; }
  </style>
</head>
<body>
  <div class="clouds" aria-hidden="true"><span>☁️</span><span>☁️</span><span>☁️</span></div>

  <h1>🎈 우리집 게임방 🎈</h1>
  <p class="sub">오늘은 무슨 놀이를 할까요?</p>

  <main class="games">
    <a class="card gaon" href="https://if-end.github.io/GaonHouse/">
      <div class="icon">🏠</div>
      <div>
        <div class="name">가온 하우스</div>
        <div class="desc">방 꾸미기 · 옷 입히기<br>쌍자음 · 문장 부호 놀이</div>
      </div>
      <div class="play">놀러 가기 ▶</div>
    </a>
    <a class="card ocean" href="https://if-end.github.io/JayAquarium/">
      <div class="icon">🐠</div>
      <div>
        <div class="name">재이 아쿠아리움</div>
        <div class="desc">바다 친구 입양하기<br>물고기 도감 · 그림 그리기</div>
      </div>
      <div class="play">놀러 가기 ▶</div>
    </a>
    <a class="card hangul" href="https://if-end.github.io/HangulNara/">
      <div class="icon">🐳</div>
      <div>
        <div class="name">한글 나라</div>
        <div class="desc">자음 · 모음 익히기<br>따라 쓰기 · 낱말 놀이</div>
      </div>
      <div class="play">놀러 가기 ▶</div>
    </a>
    <a class="card bugs" href="jungwon/">
      <div class="icon">🐞</div>
      <div>
        <div class="name">정원이 채집통</div>
        <div class="desc">곤충 채집 · 이름 맞히기<br>곤충 도감 · 박사 퀴즈</div>
      </div>
      <div class="play">놀러 가기 ▶</div>
    </a>
    <a class="card cars" href="jungwoo/">
      <div class="icon">🚗</div>
      <div>
        <div class="name">정우네 주차장</div>
        <div class="desc">숫자 · 한글 주차 놀이<br>자동차 세기 · 자동차 이름</div>
      </div>
      <div class="play">놀러 가기 ▶</div>
    </a>
  </main>

  <p class="foot">게임 안의 🎮 버튼을 누르면 이 화면으로 돌아와요</p>
</body>
</html>
