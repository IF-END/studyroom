<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="정원이 채집통">
<meta name="theme-color" content="#4d7c0f">
<title>정원이 채집통</title>
<style>
:root{
  --ink:#3f2d1d; --soft:#8a7560; --leaf:#65a30d; --leaf-d:#3f6212; --sun:#fde68a; --cream:#fffbeb;
  --red:#ef4444; --sky:#e0f2fe; --card:#ffffff;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{background:#d9f99d;color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-weight:800;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:linear-gradient(180deg,#bef264 0%,#d9f99d 40%,#ecfccb 100%)}

/* 상단바 */
#top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.tb{height:58px;min-width:58px;padding:0 16px;border-radius:20px;background:#fff;box-shadow:0 5px 0 #a3c76b;font-size:22px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.tb:active{transform:translateY(4px);box-shadow:0 1px 0 #a3c76b}
.tb .e{font-size:28px;line-height:1}
.tb.go{background:#facc15;box-shadow:0 5px 0 #ca8a04}
.tb.go:active{box-shadow:0 1px 0 #ca8a04}
#title{flex:1;min-width:0;text-align:center;font-size:26px;color:var(--leaf-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1180px){ .tb{padding:0 12px;font-size:19px} #btnFeed .t,#btnDex .t{display:none} }
#stars{background:#fef3c7;box-shadow:0 5px 0 #e5c45a}
#jarCount{font-size:18px;color:var(--soft);margin-left:4px}

/* 채집통 */
#jarWrap{flex:1;min-height:0;position:relative;margin:0 14px 10px;border-radius:40px;overflow:hidden;
  box-shadow:inset 0 0 0 10px rgba(255,255,255,.75),inset 0 0 0 14px rgba(120,160,90,.35),0 10px 0 rgba(63,98,18,.25)}
#jar{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#jarHint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(255,255,255,.88);padding:10px 22px;border-radius:999px;font-size:20px;color:var(--leaf-d);pointer-events:none;white-space:nowrap;transition:opacity .4s}
#bubble{position:absolute;z-index:5;width:300px;background:#fff;border-radius:26px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.18),0 6px 0 rgba(0,0,0,.08);display:none}
#bubble.show{display:block;animation:pop .25s cubic-bezier(.2,1.6,.5,1)}
#bubble .nm{font-size:28px;color:var(--leaf-d)}
#bubble .fc{font-size:17px;line-height:1.45;color:var(--ink);margin:6px 0 10px;font-weight:700}
#bubble .row{display:flex;gap:8px}
#bubble .row button{flex:1;height:48px;border-radius:16px;background:#f7fee7;box-shadow:0 4px 0 #cfe3a8;font-size:17px}
#bubble .row button.rel{background:#fef3c7;box-shadow:0 4px 0 #e5c45a}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* 모달 공통 */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,60,20,.45)}
.modal.show{display:flex}
.box{position:relative;width:min(94vw,900px);max-height:94vh;background:var(--cream);border-radius:40px;padding:20px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 12px 0 rgba(0,0,0,.15);animation:pop .3s cubic-bezier(.2,1.5,.5,1)}
.close{position:absolute;right:14px;top:14px;width:56px;height:56px;border-radius:18px;background:#fecdd3;box-shadow:0 4px 0 #fda4af;font-size:26px;color:#9f1239}
.close:active{transform:translateY(3px)}
.mtitle{font-size:30px;color:var(--leaf-d)}
.msg{font-size:22px;min-height:32px;text-align:center;color:var(--ink)}

/* 풀숲 탐험 */
#field{position:relative;width:100%;height:min(56vh,440px);border-radius:30px;overflow:hidden;background:linear-gradient(180deg,#bae6fd 0%,#e0f2fe 30%,#86efac 31%,#4ade80 100%)}
.clump{position:absolute;width:20%;height:44%;display:flex;align-items:flex-end;justify-content:center;font-size:min(13vh,110px);line-height:.8;transform-origin:50% 100%}
.clump.rustle{animation:rustle .35s ease-in-out 3}
@keyframes rustle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.peek{position:absolute;width:120px;height:120px;z-index:2;animation:peek .35s cubic-bezier(.2,1.6,.5,1)}
.peek.bye{transition:transform .3s, opacity .3s;transform:translateY(40px) scale(.6);opacity:0}
.peek .rare{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:18px;background:#fde047;border-radius:999px;padding:2px 10px;white-space:nowrap;box-shadow:0 3px 0 #ca8a04}
@keyframes peek{from{transform:translateY(60px) scale(.5);opacity:0}to{transform:none;opacity:1}}

/* 이름 맞추기 */
#spPic{width:260px;height:170px}
.slots{display:flex;gap:10px;justify-content:center}
.slot{width:76px;height:84px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 4px #d9e8c4;display:flex;align-items:center;justify-content:center;font-size:46px;color:#c3d4ad}
.slot.cur{box-shadow:inset 0 0 0 5px #f59e0b}
.slot.hint{color:#cbb89f}
.slot.ok{background:#dcfce7;box-shadow:inset 0 0 0 4px #22c55e;color:#15803d}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:760px}
.tile{width:84px;height:84px;border-radius:22px;background:linear-gradient(#fffbeb,#fde68a);box-shadow:0 6px 0 #d9a520;font-size:44px;color:var(--ink)}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #d9a520}
.tile.used{opacity:.15;pointer-events:none}
.tile.shake{animation:shake .4s}
.tile.glow{box-shadow:0 0 0 7px #facc15,0 6px 0 #d9a520}
@keyframes shake{20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.say{width:64px;height:64px;border-radius:50%;background:#e0f2fe;box-shadow:0 4px 0 #93c5fd;font-size:30px}

/* 도감 */
#dexBar{font-size:22px;color:var(--soft)}
#dexGrid{width:100%;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px 4px 10px}
.dc{border-radius:24px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.08);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.dc canvas{width:130px;height:84px}
.dc .n{font-size:20px}
.dc .c{position:absolute;right:10px;top:8px;font-size:15px;color:var(--soft)}
.dc.no .n{color:#c9bfae}
.dc .rr{position:absolute;left:10px;top:8px;font-size:15px}
#dexDetail{width:100%;background:#fff;border-radius:24px;padding:12px 18px;font-size:19px;line-height:1.5;box-shadow:0 4px 0 rgba(0,0,0,.06);display:none}
#dexDetail b{color:var(--leaf-d);font-size:24px}

/* 곤충 퀴즈 */
#qDots{display:flex;gap:8px;font-size:30px}
#qDots span{filter:grayscale(1);opacity:.35}
#qDots span.on{filter:none;opacity:1}
#qText{font-size:28px;text-align:center;line-height:1.35;max-width:760px}
#qPic{width:300px;height:180px;display:flex;align-items:center;justify-content:center;font-size:140px;line-height:1}
#qPic canvas{width:300px;height:180px}
#qOpts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.qo{min-width:170px;height:96px;padding:0 22px;border-radius:28px;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.12);font-size:34px;display:flex;align-items:center;justify-content:center;gap:8px}
.qo canvas{width:120px;height:72px}
.qo.col{flex-direction:column;height:auto;padding:8px 14px;font-size:24px}
.qo:active{transform:translateY(4px)}
.qo.right{box-shadow:0 0 0 7px #22c55e,0 7px 0 rgba(0,0,0,.12)}
.qo.wrong{opacity:.4;animation:shake .4s}
.qo.ox{min-width:150px;font-size:60px}
#qExplain{font-size:20px;color:var(--soft);min-height:56px;text-align:center;max-width:760px;line-height:1.4}

/* 토스트 · 축하 */
#toast{position:fixed;left:50%;top:86px;transform:translateX(-50%) translateY(-12px);z-index:40;background:rgba(63,45,29,.92);color:#fff;padding:12px 24px;border-radius:999px;font-size:20px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

@media (orientation:portrait){
  .tb .t{display:none}
  #title{font-size:22px}
  #spPic{width:220px;height:140px}
  .slot{width:64px;height:72px;font-size:38px}
  .tile{width:72px;height:72px;font-size:36px}
}
@media (max-height:720px) and (orientation:landscape){
  .tb{height:50px;font-size:19px}
  #spPic{height:130px}
  #field{height:46vh}
  .box{gap:8px;padding:14px 18px 16px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <a class="tb" href="../" aria-label="게임방으로"><span class="e">🎮</span><span class="t">게임방</span></a>
    <div id="title">🐞 정원이 채집통</div>
    <button class="tb" id="stars"><span class="e">⭐</span><span id="starCnt">0</span></button>
    <button class="tb" id="btnFeed" aria-label="곤충 젤리 주기"><span class="e">🍯</span><span class="t">젤리</span></button>
    <button class="tb" id="btnQuiz"><span class="e">🧠</span><span class="t">곤충 퀴즈</span></button>
    <button class="tb" id="btnDex"><span class="e">📖</span><span class="t">도감</span></button>
    <button class="tb go" id="btnField"><span class="e">🌿</span><span class="t">풀숲 탐험</span></button>
  </header>
  <div id="jarWrap">
    <canvas id="jar"></canvas>
    <div id="jarHint">🌿 풀숲 탐험을 눌러 곤충을 찾아봐요!</div>
    <div id="bubble">
      <div class="nm" id="bName"></div>
      <div class="fc" id="bFact"></div>
      <div class="row">
        <button id="bSay">🔊 듣기</button>
        <button id="bDex">📖 도감</button>
        <button class="rel" id="bRelease">🌿 놓아주기</button>
      </div>
    </div>
  </div>
</div>

<!-- 풀숲 탐험 -->
<div class="modal" id="mField">
  <div class="box">
    <button class="close" data-close>✕</button>
    <div class="mtitle">🌿 풀숲 탐험</div>
    <div class="msg" id="fMsg">풀이 흔들리면 곤충이 나타나요. 재빨리 톡!</div>
    <div id="field"></div>
  </div>
</div>

<!-- 이름 맞추기 -->
<div class="modal" id="mSpell">
  <div class="box">
    <button class="close" data-close>✕</button>
    <div class="mtitle" id="spTitle">채집 성공! 이름을 맞혀요</div>
    <div style="display:flex;align-items:center;gap:16px">
      <canvas id="spPic" width="520" height="340"></canvas>
      <button class="say" id="spSay" aria-label="이름 듣기">🔊</button>
    </div>
    <div class="msg" id="spMsg">이름을 듣고 글자를 순서대로 눌러요</div>
    <div class="slots" id="spSlots"></div>
    <div class="tiles" id="spTiles"></div>
  </div>
</div>

<!-- 도감 -->
<div class="modal" id="mDex">
  <div class="box" style="height:92vh">
    <button class="close" data-close>✕</button>
    <div class="mtitle">📖 정원이 곤충 도감</div>
    <div id="dexBar"></div>
    <div id="dexGrid"></div>
    <div id="dexDetail"></div>
  </div>
</div>

<!-- 곤충 퀴즈 -->
<div class="modal" id="mQuiz">
  <div class="box">
    <button class="close" data-close>✕</button>
    <div class="mtitle">🧠 곤충 박사 퀴즈</div>
    <div id="qDots"></div>
    <div id="qText"></div>
    <div id="qPic"></div>
    <div id="qOpts"></div>
    <div id="qExplain"></div>
  </div>
</div>

<div id="toast"></div>
<canvas id="fx"></canvas>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* =====================================================
   곤충 데이터  (rare: 1 흔함 · 2 보통 · 3 희귀)
===================================================== */
const SP=[
 {id:'ladybug',  name:'무당벌레',   kind:'ladybug',  size:.75,rare:1,fly:false,col:['#dc2626','#111827'],
  fact:'진딧물을 잡아먹어서 농작물을 지켜 주는 고마운 곤충이에요. 등의 점무늬로 종류를 구별해요.',
  hint:'빨간 등에 까만 점무늬가 있고, 진딧물을 잡아먹어요'},
 {id:'ant',      name:'개미',       kind:'ant',      size:.62,rare:1,fly:false,col:['#1f2937'],
  fact:'여왕개미, 일개미가 함께 모여 살아요. 자기 몸무게보다 훨씬 무거운 것도 들 수 있어요.',
  hint:'여왕을 중심으로 무리 지어 살고, 무거운 먹이도 거뜬히 날라요'},
 {id:'whitebfly',name:'배추흰나비', kind:'butterfly',size:1.0,rare:1,fly:true, col:['#f8fafc','#1f2937'],
  fact:'하얀 날개 끝에 검은 무늬가 있어요. 배추 같은 채소 잎에 알을 낳아요.',
  hint:'하얀 날개를 가졌고, 배추 잎에 알을 낳아요'},
 {id:'grasshopper',name:'메뚜기',   kind:'hopper',   size:1.0,rare:1,fly:false,col:['#65a30d','#3f6212'],
  fact:'뒷다리가 길고 튼튼해서 몸길이의 몇 배나 높이 뛸 수 있어요. 풀잎을 먹어요.',
  hint:'튼튼한 뒷다리로 풀밭에서 폴짝폴짝 높이 뛰어요'},
 {id:'honeybee', name:'꿀벌',       kind:'bee',      size:.78,rare:1,fly:true, col:['#facc15','#1f2937'],
  fact:'꽃에서 꿀과 꽃가루를 모아요. 엉덩이춤으로 친구들에게 꽃이 있는 곳을 알려 줘요.',
  hint:'꽃에서 꿀을 모으고, 춤으로 친구에게 길을 알려 줘요'},
 {id:'cricket',  name:'귀뚜라미',   kind:'hopper',   size:.9, rare:1,fly:false,col:['#78350f','#451a03'],cricket:true,
  fact:'수컷이 날개를 서로 비벼서 귀뚤귀뚤 소리를 내요. 가을밤에 많이 들을 수 있어요.',
  hint:'가을밤에 날개를 비벼 귀뚤귀뚤 소리를 내요'},
 {id:'swallowtail',name:'호랑나비', kind:'butterfly',size:1.3,rare:2,fly:true, col:['#fde047','#111827'],tail:true,
  fact:'노란 날개에 호랑이처럼 검은 줄무늬가 있어요. 애벌레는 귤나무나 산초나무 잎을 먹어요.',
  hint:'노란 날개에 호랑이 같은 검은 줄무늬가 있어요'},
 {id:'dragonfly',name:'고추잠자리', kind:'dragonfly',size:1.3,rare:2,fly:true, col:['#dc2626','#7f1d1d'],
  fact:'커다란 겹눈으로 사방을 볼 수 있어요. 날면서 모기 같은 작은 곤충을 잡아먹어요.',
  hint:'커다란 눈과 투명한 날개 네 장으로 하늘을 쌩쌩 날아요'},
 {id:'cicada',   name:'매미',       kind:'cicada',   size:1.1,rare:2,fly:true, col:['#4d5d2c','#1c1917'],
  fact:'애벌레로 땅속에서 여러 해를 보내요. 여름에 수컷이 배에 있는 발음기관으로 맴맴 울어요.',
  hint:'여름에 나무에 붙어 맴맴 큰 소리로 울어요'},
 {id:'longhead', name:'방아깨비',   kind:'hopper',   size:1.3,rare:2,fly:false,col:['#84cc16','#4d7c0f'],longhead:true,
  fact:'머리가 뾰족하고 길어요. 뒷다리를 잡으면 방아를 찧듯이 몸을 끄덕끄덕 움직여요.',
  hint:'뒷다리를 잡으면 방아 찧듯 몸을 끄덕끄덕해요'},
 {id:'mantis',   name:'사마귀',     kind:'mantis',   size:1.3,rare:2,fly:false,col:['#16a34a','#14532d'],
  fact:'앞다리가 낫처럼 생겨서 다른 곤충을 꽉 붙잡아요. 고개를 이리저리 돌릴 수 있어요.',
  hint:'앞다리가 낫처럼 생겨서 먹이를 꽉 붙잡아요'},
 {id:'strider',  name:'소금쟁이',   kind:'strider',  size:1.0,rare:2,fly:false,col:['#44403c','#1c1917'],
  fact:'다리 끝의 잔털에 물이 묻지 않아서 물 위를 미끄러지듯 걸어 다녀요.',
  hint:'긴 다리로 물 위를 미끄러지듯 걸어 다녀요'},
 {id:'stag',     name:'사슴벌레',   kind:'beetle',   size:1.3,rare:3,fly:false,col:['#3b1d0f','#1c0f08'],horn:'stag',
  fact:'수컷은 사슴뿔처럼 생긴 큰턱으로 다른 수컷과 힘겨루기를 해요. 나무 수액을 먹어요.',
  hint:'사슴뿔처럼 생긴 커다란 턱으로 힘겨루기를 해요'},
 {id:'rhino',    name:'장수풍뎅이', kind:'beetle',   size:1.4,rare:3,fly:false,col:['#5b2a12','#2b1308'],horn:'rhino',
  fact:'수컷 머리에 끝이 갈라진 긴 뿔이 있어요. 몸집이 크고 힘이 아주 세요.',
  hint:'수컷 머리에 끝이 갈라진 긴 뿔이 있어요'},
 {id:'firefly',  name:'반딧불이',   kind:'beetle',   size:.72,rare:3,fly:true, col:['#292524','#f97316'],glow:true,

function newBug(spId,x,y){
  const sp=SPMAP[spId]; if(!sp) return null;
  const b={sp, x:x!=null?x:rnd(80,W-80), y:y!=null?y:rnd(80,H-80), a:rnd(0,Math.PI*2), v:0, pause:rnd(0,60), t:rnd(0,100), glow:0, hop:0};

const SPEED={ant:1.5,ladybug:.7,beetle:.55,butterfly:1.5,dragonfly:2.6,bee:1.6,hopper:.8,cicada:1.0,mantis:.45,strider:.9};
function stepBug(b,dt){
  const sp=b.sp, base=SPEED[sp.kind]*U;
  b.t+=dt/60;
  if(sp.glow){b.glow=(Math.sin(b.t*3.2)>0.2)?1:0;}
  let tx=null,ty=null;
  if(jelly && sp.kind!=='strider'){tx=jelly.x; ty=jelly.y;}
  else if((sp.kind==='butterfly'||sp.kind==='bee') && b.flower!=null){tx=flowers[b.flower].x; ty=flowers[b.flower].y;}
  if(b.pause>0){b.pause-=dt; b.v*=.85; if(b.pause<=0&&(sp.kind==='butterfly'||sp.kind==='bee')) b.flower=Math.random()<.5?Math.floor(Math.random()*flowers.length):null;}
  else{
    if(tx!=null){const d=Math.hypot(tx-b.x,ty-b.y), want=Math.atan2(ty-b.y,tx-b.x); let da=((want-b.a+Math.PI*3)%(Math.PI*2))-Math.PI; b.a+=da*.08; if(d<26*U){b.pause=rnd(90,200); if(!jelly) b.flower=null;}}
    else b.a+=rnd(-.08,.08)*(sp.fly?2:1);
    b.v+=(base-b.v)*.08;
    if(sp.kind==='hopper'&&Math.random()<.004){b.hop=26; b.v=base*6;}
    if(Math.random()<(sp.fly?.002:.006)) b.pause=rnd(40,160);
  }
  if(b.hop>0){b.hop-=dt; if(b.hop<=0) b.v=base;}
  b.x+=Math.cos(b.a)*b.v*dt; b.y+=Math.sin(b.a)*b.v*dt;
  const m=40*U;
  if(sp.kind==='strider'){const d=Math.hypot(b.x-waterDish.x,b.y-waterDish.y); if(d>waterDish.r-18*U){b.a=Math.atan2(waterDish.y-b.y,waterDish.x-b.x)+rnd(-.5,.5);}}
  else if(b.x<m||b.x>W-m||b.y<m||b.y>H-m){b.a=Math.atan2(H/2-b.y,W/2-b.x)+rnd(-.6,.6); b.x=Math.min(Math.max(b.x,m),W-m); b.y=Math.min(Math.max(b.y,m),H-m);}
}
function frame(now){
  const dt=Math.min(3,(now-last)/16.67); last=now; T+=dt/60;
  if(W&&H&&bg){
    ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(bg,0,0); ctx.setTransform(DPR,0,0,DPR,0,0);
    if(jelly){jelly.life-=dt; if(jelly.life<=0) jelly=null; else{ctx.globalAlpha=Math.min(1,jelly.life/60); ell(ctx,jelly.x,jelly.y,16*U,12*U,'#fb923c','#c2410c',2); ell(ctx,jelly.x-4*U,jelly.y-3*U,6*U,3*U,'rgba(255,255,255,.55)'); ctx.globalAlpha=1;}}
    // 그림자 먼저
    bugs.forEach(b=>{stepBug(b,dt); const flying=b.sp.fly&&b.pause<=0||b.hop>0; const s=U*b.sp.size*JS; ctx.save(); ctx.translate(b.x+(flying?14:3),b.y+(flying?18:4)); ctx.rotate(b.a); ctx.scale(s,s); ctx.globalAlpha=.22; ell(ctx,0,0,26,flying?18:14,'#000'); ctx.restore();});
    bugs.forEach(b=>{
      const s=U*b.sp.size*JS*(b.hop>0?1.12:1); ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a); ctx.scale(s,s);
      if(b===selected){ctx.globalAlpha=.35; ell(ctx,0,0,44,36,'#fde047'); ctx.globalAlpha=1;}
      drawInsect(ctx,b.sp,b.t,b.pause<=0,b.glow); ctx.restore();
    });
    if(selected) placeBubble();
  }
  requestAnimationFrame(frame);
}

/* ---------- 이름 맞추기 (미리보기 없음, 비슷한 글자 섞기) ---------- */
function similarSyllables(ch){
  const code=ch.charCodeAt(0)-0xAC00; if(code<0||code>11171) return [];
  const cho=Math.floor(code/588), jung=Math.floor((code%588)/28), jong=code%28;
  const make=(c,v,f)=>String.fromCharCode(0xAC00+c*588+v*28+f);
  const VP={0:4,4:0,8:13,13:8,1:5,5:1,18:20,20:18,2:6,6:2,12:17,17:12,14:9,9:14,11:16,16:11};
  const JS={0:4,4:21,21:4,8:16,16:8,1:0,17:16,19:0};
  const CS={0:15,15:0,1:0,3:16,16:3,4:3,7:17,17:7,8:7,9:12,12:14,14:12,10:9,13:12};
  const out=[]; if(VP[jung]!=null) out.push(make(cho,VP[jung],jong)); if(JS[jong]!=null) out.push(make(cho,jung,JS[jong])); if(CS[cho]!=null) out.push(make(CS[cho],jung,jong)); return out;
}
const CHO=[...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];
const choOf=ch=>{const c=ch.charCodeAt(0)-0xAC00; return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch;};
const SPL={sp:null,chars:[],i:0,miss:0};
function openSpell(sp){

  $('#spTitle').textContent=(sp.rare===3?'✨ 희귀 곤충 채집! ':'채집 성공! ')+'이름을 맞혀요';

  $('#spSlots').innerHTML=SPL.chars.map(()=>'<div class="slot">?</div>').join('');
  const used=new Set(SPL.chars);
  const looks=shuffle(SPL.chars.flatMap(similarSyllables)).filter(c=>{if(used.has(c))return false; used.add(c); return true;}).slice(0,SPL.chars.length>=4?4:3);
  const pool=[...new Set(SP.flatMap(s=>[...s.name]))].filter(c=>!used.has(c));
  const tiles=shuffle(SPL.chars.concat(looks,shuffle(pool).slice(0,2)));
  const box=$('#spTiles'); box.innerHTML='';
  tiles.forEach(ch=>{const b=document.createElement('button'); b.className='tile'; b.textContent=ch; b.onclick=()=>spellTap(b,ch); box.appendChild(b);});
  markSlot(); setTimeout(()=>say([sp.name,'이름을 맞혀 봐요.']),250);
}

function spellTap(b,ch){

  if(ch!==want){
    SPL.miss++; Sfx.bad(); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');

    const choices=shuffle([q.sp].concat(shuffle(SP.filter(s=>s.id!==q.sp.id)).slice(0,2)));
    choices.forEach(sp=>{const b=document.createElement('button'); b.className='qo col'; const c=document.createElement('canvas'); c.width=240; c.height=144; drawPortrait(c,sp,false); b.appendChild(c); b.insertAdjacentHTML('beforeend','<span>'+sp.name+'</span>'); b.dataset.id=sp.id; b.onclick=()=>answer(b,sp.id===q.sp.id); opts.appendChild(b);});
    say([q.sp.hint,'이 곤충은 누구일까요?']);
  }
}
function answer(b,ok){
  if(QZ.lock) return; QZ.lock=true;
  const q=QZ.list[QZ.i];
  let ex='';
  if(q.t==='ox') ex=q.sp?'⭕ 곤충이에요! 다리가 6개이고, 몸이 머리·가슴·배 세 부분으로 나뉘어요.':'❌ '+q.n.why;
  else ex='정답은 '+q.sp.name+'! '+q.sp.fact;
  if(ok){QZ.ok++; addStars(1); Sfx.good(); b.classList.add('right'); const r=b.getBoundingClientRect(); confetti(40,r.left+r.width/2,r.top+r.height/2);}
  else{Sfx.bad(); b.classList.add('wrong'); $$('#qOpts .qo').forEach(x=>{if((q.t==='ox'&&x.dataset.v===q.ans)||(q.t==='mc'&&x.dataset.id===q.sp.id)) x.classList.add('right');});}
  $('#qExplain').textContent=ex; say([ok?'딩동댕!':'아쉬워요.',ex.replace(/[⭕❌]/g,'')]);
  QZ.i++; quizDots();
  setTimeout(()=>{if($('#mQuiz').classList.contains('show')) showQuiz(false);},ok?3600:4600);
}

document.addEventListener('visibilitychange',()=>{if(document.hidden){try{speechSynthesis.cancel();}catch(e){}}});
